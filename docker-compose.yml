services:
  db:
    image: postgres:16-alpine
    container_name: tse1-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: tse1-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8090:5050"
    depends_on:
      db:
        condition: service_healthy

  # Container + log monitoring. Postgres itself is already monitored by the
  # host Agent (Lab 3) - this one is for container-level metrics/logs, which
  # a host Agent on macOS can't see (Docker Desktop runs containers in its
  # own VM, invisible to a native Mac process).
  datadog-agent:
    image: gcr.io/datadoghq/agent:latest
    container_name: tse1-datadog-agent
    pid: host
    cgroup: host
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      # Exclude only the agent's own *logs* - avoids it tailing its own
      # log-collection messages in a loop. Its container metrics (CPU/mem)
      # still get collected normally.
      DD_CONTAINER_EXCLUDE_LOGS: "name:tse1-datadog-agent"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    depends_on:
      - db
      - web

volumes:
  pgdata: